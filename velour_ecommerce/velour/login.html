<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Velour</title>
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/paginas/auth.css">
</head>
<body>

<main>
    <div class="auth-page">

        <!-- Panel visual izquierdo -->
        <div class="auth-visual">
            <div class="auth-visual__img" style="background:linear-gradient(160deg,#1A1A2E 0%, #2C1810 60%, #1A1A2E 100%);"></div>
            <div class="auth-visual__content">
                <div class="auth-visual__logo">Vel<span>our</span></div>
                <p class="auth-visual__quote">"La moda es una forma de expresar quién eres sin decir una sola palabra."</p>
                <p class="auth-visual__sub">— Colección SS 2025</p>
            </div>
        </div>

        <!-- Formulario -->
        <div class="auth-form-side">
            <div class="auth-form-box">
                <a href="index.html" style="display:block; margin-bottom:var(--sp-8); font-family:var(--font-display); font-size:var(--fs-2xl); font-weight:var(--fw-semibold); letter-spacing:0.14em; text-transform:uppercase; color:var(--color-primary);">
                    Vel<span style="color:var(--color-secondary);">our</span>
                </a>
                <h1 class="auth-form-box__title">Bienvenida de vuelta</h1>
                <p class="auth-form-box__sub">Inicia sesión para acceder a tu cuenta y pedidos.</p>

                <form class="auth-form" action="index.html">
                    <div class="form-group">
                        <label class="form-label" for="email">Correo electrónico</label>
                        <input class="form-control" type="email" id="email" placeholder="ana@correo.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password" style="display:flex; justify-content:space-between;">
                            Contraseña
                            <a href="#" style="color:var(--color-secondary); font-weight:var(--fw-regular); text-transform:none; letter-spacing:normal;">¿Olvidaste tu contraseña?</a>
                        </label>
                        <input class="form-control" type="password" id="password" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn--primary btn--full btn--lg">Iniciar sesión</button>
                </form>

                <div class="auth-divider"><span>o continúa con</span></div>

                <button class="btn btn--ghost btn--full" style="gap:var(--sp-3);">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Continuar con Google
                </button>

                <p class="auth-link">
                    ¿No tienes cuenta? <a href="registro.html">Crear cuenta</a>
                </p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
